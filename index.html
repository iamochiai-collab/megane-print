<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メガネプリント教材庫</title>
<link rel="icon" href="icon.png?v=2">
<link rel="apple-touch-icon" href="icon.png?v=2">
<meta name="description" content="プリント作りやふせんボードなど、授業で使えるサイトの入口です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F9FB;
    --grid:#DCE7EE;
    --ink:#3A231C;
    --sub:#6A5A52;
    --card:#FFFFFF;
    --line:#C8D5DE;
    --hover:#F0F5F8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#182027;
      --grid:#232E37;
      --ink:#E7EDF1;
      --sub:#A2B0BB;
      --card:#1F2930;
      --line:#34424D;
      --hover:#26323B;
    }
  }

  /* 教科の色（明るい画面 / 暗い画面） */
  .c-red   { --c:#C23B33; }
  .c-blue  { --c:#2B66AE; }
  .c-yellow{ --c:#A87F00; }
  .c-green { --c:#2E8A57; }
  .c-purple{ --c:#7A4FB0; }
  @media (prefers-color-scheme: dark){
    .c-red   { --c:#F27B71; }
    .c-blue  { --c:#7FB0EE; }
    .c-yellow{ --c:#F0C53A; }
    .c-green { --c:#6CCB94; }
    .c-purple{ --c:#B998E6; }
  }

  *{ box-sizing:border-box; }

  /* メガネのマウスポインター（数字はクリックする位置＝メガネの真ん中） */
  html{ cursor:url("cursor.png") 24 10, auto; }
  a, button{ cursor:url("cursor-hover.png") 24 10, pointer; }
  @media (prefers-reduced-motion: no-preference){ html{ scroll-behavior:smooth; } }
  body{
    margin:0;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    font-family:"BIZ UDPGothic", system-ui, sans-serif;
    line-height:1.7;
  }
  .wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:56px 16px 72px; }

  header h1{ margin:0; line-height:0; }
  header h1 img{
    display:block;
    width:100%;
    max-width:560px;
    height:auto;
  }
  @media (prefers-color-scheme: dark){
    header h1 img{
      background:#FBF8F4;
      border-radius:14px;
      padding:8px 12px;
    }
  }
  header p{ margin:.75rem 0 0; color:var(--sub); font-size:1.05rem; }

  /* 教科の切りかえボタン */
  .jump{
    display:flex; flex-wrap:wrap; gap:10px;
    margin:36px 0 0; padding:0; list-style:none;
  }
  .jump a{
    display:inline-block;
    padding:.4rem 1.1rem;
    border:2px solid var(--c);
    border-radius:999px;
    background:var(--card);
    color:var(--c);
    font-weight:700;
    text-decoration:none;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), background-color .2s, color .2s;
  }
  .jump a:hover, .jump a:focus-visible{
    transform:translateY(-3px) scale(1.06);
    background:var(--c); color:var(--card);
    outline:none;
  }

  /* 教科のまとまり */
  .subject{ margin-top:48px; scroll-margin-top:16px; }
  .subject-head{
    display:flex; align-items:center; gap:12px;
    margin:0 0 16px;
    font-size:1.4rem; font-weight:700;
    color:var(--c);
  }
  .subject-head::after{
    content:""; flex:1; height:2px;
    background:var(--c); opacity:.35; border-radius:2px;
  }
  .empty{
    margin:0; padding:16px 20px;
    border:2px dashed var(--line); border-radius:10px;
    color:var(--sub);
  }

  .list{ list-style:none; margin:0; padding:0; display:grid; gap:16px; }

  .item a{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:20px;
    padding:18px 20px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:8px solid var(--c);
    border-radius:10px;
    color:inherit;
    text-decoration:none;
    box-shadow:0 1px 0 rgba(58,35,28,.04);
    transition:
      transform .45s cubic-bezier(.34,1.56,.64,1),
      box-shadow .3s ease,
      background-color .2s;
  }
  /* ポワンとうき上がる */
  .item a:hover, .item a:focus-visible{
    transform:translateY(-5px) scale(1.025);
    box-shadow:0 14px 28px rgba(58,35,28,.16);
    background:var(--hover);
  }
  .item a:active{ transform:scale(.98); transition-duration:.12s; }
  .item a:focus-visible{ outline:3px solid var(--c); outline-offset:3px; }

  /* 漢字練習帳のマス */
  .masu{
    position:relative;
    width:68px; height:68px;
    border:2px solid var(--c);
    background:var(--card);
    display:grid; place-items:center;
    font-family:"Klee One", serif;
    font-weight:600;
    font-size:2.2rem;
    line-height:1;
    color:var(--c);
    transition:transform .5s cubic-bezier(.34,1.8,.64,1);
  }
  .masu::before, .masu::after{
    content:""; position:absolute; opacity:.45;
  }
  .masu::before{ left:50%; top:0; bottom:0; border-left:1px dashed var(--c); }
  .masu::after { top:50%; left:0; right:0; border-top:1px dashed var(--c); }
  .masu span{ position:relative; z-index:1; }
  .item a:hover .masu, .item a:focus-visible .masu{
    transform:rotate(-8deg) scale(1.12);
  }

  .text h3{ margin:0; font-size:1.25rem; font-weight:700; }
  .text p{ margin:.2rem 0 0; color:var(--sub); font-size:.95rem; }

  .open{
    white-space:nowrap;
    font-weight:700;
    color:var(--c);
    border:2px solid var(--c);
    border-radius:999px;
    padding:.35rem 1rem;
    transition:background-color .2s, color .2s;
  }
  .item a:hover .open, .item a:focus-visible .open{
    background:var(--c); color:var(--card);
  }

  footer{ margin-top:56px; color:var(--sub); font-size:.85rem; }

  @media (max-width:520px){
    .wrap{ padding-top:40px; }
    .item a{ grid-template-columns:auto 1fr; gap:14px; padding:14px 16px; }
    .masu{ width:54px; height:54px; font-size:1.8rem; }
    .open{ display:none; }
  }
  /* ===== メガネをかけてよろこぶ人たち（パソコンだけ） ===== */
  body{ position:relative; }
  .people{ display:none; }
  @media (min-width:1100px) and (hover:hover) and (pointer:fine){
    .people{ display:block; }
  }
  .people{
    position:absolute; top:0; left:0; right:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
    --side:calc((100vw - 760px) / 2);
    --w:clamp(84px, calc(var(--side) * .45), 135px);
  }
  .person{
    position:absolute;
    width:calc(var(--w) * var(--s, 1));
    pointer-events:none;
    opacity:0;
    transform-origin:50% 100%;
  }
  .person.left { left: calc(var(--side) / 2 - var(--w) * var(--s, 1) / 2 + var(--dx, 0px)); }
  .person.right{ right:calc(var(--side) / 2 - var(--w) * var(--s, 1) / 2 + var(--dx, 0px)); }
  .person.in{ animation:popin .7s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes popin{
    0%  { opacity:0; transform:translateY(40px) scale(.6); }
    60% { opacity:1; }
    100%{ opacity:1; transform:none; }
  }
  .person svg{ display:block; width:100%; height:auto; overflow:visible; }
  .person svg *{ pointer-events:visiblePainted; }
  .person svg{ cursor:url("cursor-hover.png") 24 10, pointer; }
  .person.handing svg{ cursor:none; }

  .fig, .arm, .glasses, .spark{ transform-box:view-box; }
  .fig{ transform-origin:80px 240px; }
  .arm{ transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
  .arm-l{ transform-origin:38px 150px; }
  .arm-r{ transform-origin:122px 150px; }
  .glasses{ opacity:0; transform-origin:80px 85px; }
  .wear .glasses{ opacity:1; }

  .eyes-happy, .mouth-happy, .spark{ opacity:0; }
  .eyes-calm, .eyes-happy, .mouth-calm, .mouth-happy, .cheek{ transition:opacity .15s; }
  .cheek{ opacity:.55; }

  .joy .eyes-calm, .joy .mouth-calm{ opacity:0; }
  .joy .eyes-happy, .joy .mouth-happy, .joy .cheek{ opacity:1; }
  .joy .arm-l{ transform:rotate(145deg); }
  .joy .arm-r{ transform:rotate(-145deg); }
  .joy .fig{ animation:hop .8s cubic-bezier(.3,.7,.4,1) .25s; }
  .joy .spark{ animation:spark 1s ease-out .3s; }
  .spark{ transform-origin:80px 70px; }

  @keyframes hop{
    0%,100%{ transform:translateY(0); }
    30%{ transform:translateY(-16px) scale(1.02, .99); }
    55%{ transform:translateY(0) scale(1.02, .97); }
    75%{ transform:translateY(-6px); }
  }
  @keyframes spark{
    0%{ opacity:0; transform:scale(.6); }
    25%{ opacity:1; transform:scale(1.05); }
    70%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .arm{ transition:none; }
    .person.in{ animation:none; opacity:1; }
    .joy .fig, .joy .spark{ animation:none; }
    .joy .arm-l, .joy .arm-r{ transform:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .item a, .masu, .jump a{ transition:none; }
    .item a:hover, .item a:focus-visible, .item a:active,
    .item a:hover .masu, .item a:focus-visible .masu,
    .jump a:hover, .jump a:focus-visible{ transform:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><img src="logo.png?v=2" alt="メガネプリント教材庫" width="1200" height="411"></h1>
      <p>プリント作りやふせんボードなど、授業で使えるサイトの入口です。</p>
    </header>

    <nav aria-label="教科">
      <ul class="jump" id="jump"></ul>
    </nav>

    <main id="subjects"></main>

    <footer>使いたいものをえらんでください。</footer>
  </div>

  <div class="people" id="people" aria-hidden="true"></div>

<script>
  /*
    ★ 教科をふやすとき：SUBJECTS に { name, color, sites:[] } を1つ足す
      （例：理科なら { name: "理科", color: "green", sites: [] }）
    ★ サイトをふやすとき：その教科の sites に { … } を1つ足す
      ji    : マスに入れる1文字
      name  : サイトの名前
      desc  : ひとことせつめい
      url   : サイトのアドレス
    color は red / blue / yellow / green / purple のどれか
  */
  const SUBJECTS = [
    {
      name: "国語",
      color: "red",
      sites: [
        {
          ji: "国",
          name: "国語プリント",
          desc: "ようじ〜中学生向けの国語プリントを作って印刷できます。",
          url: "https://iamochiai-collab.github.io/Kokugo-worksheet-generator/"
        },
        {
          ji: "漢",
          name: "漢字テスト・ふくしゅうプリント",
          desc: "小1〜中学の漢字テストや練習プリントを、縦書きのPDFで作れます。",
          url: "https://iamochiai-collab.github.io/KANJI-PRINT/"
        }
      ]
    },
    {
      name: "算数・数学",
      color: "blue",
      sites: [
        {
          ji: "算",
          name: "算数プリント",
          desc: "算数・数学のプリントを作って印刷できます。",
          url: "https://iamochiai-collab.github.io/Math-worksheet-generator/"
        }
      ]
    },
    {
      name: "その他",
      color: "yellow",
      sites: [
        {
          ji: "付",
          name: "ふせんボード",
          desc: "班ごとにふせんを貼って話し合い、先生に提出できます。",
          url: "https://iamochiai-collab.github.io/WHITE-BOARD/"
        }
      ]
    }
  ];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  const jump = document.getElementById("jump");
  const main = document.getElementById("subjects");

  SUBJECTS.forEach(function (sub, i) {
    const color = "c-" + (sub.color || "blue");
    const id = "subject-" + (i + 1);

    // 上の切りかえボタン
    const jli = el("li", color);
    const ja = el("a", null, sub.name);
    ja.href = "#" + id;
    jli.appendChild(ja);
    jump.appendChild(jli);

    // 教科のまとまり
    const section = el("section", "subject " + color);
    section.id = id;
    section.appendChild(el("h2", "subject-head", sub.name));

    if (!sub.sites || sub.sites.length === 0) {
      section.appendChild(el("p", "empty", "じゅんびちゅうです。"));
    } else {
      const ul = el("ul", "list");
      sub.sites.forEach(function (s) {
        const li = el("li", "item");
        const a = el("a");
        a.href = s.url;

        const masu = el("div", "masu");
        masu.setAttribute("aria-hidden", "true");
        masu.appendChild(el("span", null, s.ji));

        const text = el("div", "text");
        text.appendChild(el("h3", null, s.name));
        text.appendChild(el("p", null, s.desc));

        a.appendChild(masu);
        a.appendChild(text);
        a.appendChild(el("span", "open", "ひらく"));
        li.appendChild(a);
        ul.appendChild(li);
      });
      section.appendChild(ul);
    }
    main.appendChild(section);
  });
  /* ===== メガネをかけてよろこぶ人たち =====
     ★ キャラをふやすとき：CAST に { shirt, hair, hairColor } を1つ足す
       hair は short / bob / tails / long / bun / cap / spiky のどれか
  */
  (function () {
    const B = "#3A1E16", SKIN = "#FCE6D4", CHEEK = "#F5A898", SPARK = "#F6B73C";
    const HAIR = {
      short: 'M36 86 Q30 30 80 30 Q130 30 124 86 Q118 60 98 54 Q86 64 64 60 Q46 60 40 74 Z',
      bob:   'M34 108 Q24 28 80 28 Q136 28 126 108 Q118 108 117 98 Q120 64 100 56 Q80 66 56 60 Q42 70 43 98 Q42 108 34 108 Z',
      tails: 'M37 84 Q32 30 80 30 Q128 30 123 84 Q116 58 80 56 Q50 58 37 84 Z',
      long:  'M30 140 Q20 28 80 28 Q140 28 130 140 Q120 142 116 128 Q120 66 100 56 Q80 66 56 60 Q42 70 44 128 Q40 142 30 140 Z',
      bun:   'M37 84 Q32 30 80 30 Q128 30 123 84 Q116 58 80 56 Q50 58 37 84 Z',
      cap:   'M36 86 Q30 40 80 40 Q130 40 124 86 Q118 62 80 60 Q46 62 36 86 Z',
      spiky: 'M36 84 L33 52 L47 44 L50 25 L65 35 L80 19 L95 35 L110 25 L113 44 L127 52 L124 84 Q116 60 80 58 Q44 60 36 84 Z'
    };
    const CAST = [
      { shirt: "#A8D98A", hair: "bob",   hairColor: "#6B3F2A" },
      { shirt: "#8CC8EA", hair: "short", hairColor: "#4A2C20" },
      { shirt: "#F7C04A", hair: "tails", hairColor: "#3A2219" },
      { shirt: "#F4A6B8", hair: "long",  hairColor: "#5A3324" },
      { shirt: "#F6A15A", hair: "spiky", hairColor: "#3A2219" },
      { shirt: "#C5A8E8", hair: "bun",   hairColor: "#4A2C20" },
      { shirt: "#7FD1C1", hair: "cap",   hairColor: "#4A2C20", cap: "#E2574C" }
    ];
    const PAPERS = [["#F7C04A", "#A8D98A"], ["#8CC8EA", "#F4A6B8"], ["#A8D98A", "#F7C04A"], ["#C5A8E8", "#8CC8EA"]];

    function arm(side, shirt) {
      const d = side === "l" ? "M38 150 Q24 200 28 246" : "M122 150 Q136 200 132 246";
      const hx = side === "l" ? 28 : 132;
      return '<g class="arm arm-' + side + '">' +
        '<path d="' + d + '" stroke="' + B + '" stroke-width="19" stroke-linecap="round" fill="none"/>' +
        '<path d="' + d + '" stroke="' + shirt + '" stroke-width="10" stroke-linecap="round" fill="none"/>' +
        '<circle cx="' + hx + '" cy="252" r="9" fill="' + SKIN + '" stroke="' + B + '" stroke-width="4.5"/>' +
        '</g>';
    }

    function svg(o, pc) {
      const st = '" stroke="' + B + '" stroke-width="5"';
      let back = "";
      if (o.hair === "tails") back = '<circle cx="31" cy="66" r="15" fill="' + o.hairColor + st + '/><circle cx="129" cy="66" r="15" fill="' + o.hairColor + st + '/>';
      if (o.hair === "bun")   back = '<circle cx="80" cy="30" r="17" fill="' + o.hairColor + st + '/>';
      const cap = o.cap
        ? '<path d="M38 70 Q36 22 80 22 Q124 22 122 70 Z" fill="' + o.cap + st + ' stroke-linejoin="round"/>' +
          '<path d="M76 70 H138 Q146 72 140 80 H76 Z" fill="' + o.cap + st + ' stroke-linejoin="round"/>'
        : "";
      return '<svg viewBox="0 0 160 284" xmlns="http://www.w3.org/2000/svg">' +
        '<g class="fig">' + back +
          '<path d="M30 236 V182 Q30 118 80 118 Q130 118 130 182 V236 Z" fill="' + o.shirt + st + ' stroke-linejoin="round"/>' +
          arm("l", o.shirt) + arm("r", o.shirt) +
          '<circle cx="80" cy="80" r="44" fill="' + SKIN + st + '/>' +
          '<path d="' + HAIR[o.hair] + '" fill="' + o.hairColor + st + ' stroke-linejoin="round"/>' + cap +
          '<circle class="cheek" cx="52" cy="99" r="7.5" fill="' + CHEEK + '"/>' +
          '<circle class="cheek" cx="108" cy="99" r="7.5" fill="' + CHEEK + '"/>' +
          '<g class="eyes-calm" fill="' + B + '"><circle cx="64" cy="85" r="4.5"/><circle cx="96" cy="85" r="4.5"/></g>' +
          '<g class="eyes-happy" fill="none" stroke="' + B + '" stroke-width="4.5" stroke-linecap="round">' +
            '<path d="M57 88 Q64 77 71 88"/><path d="M89 88 Q96 77 103 88"/></g>' +
          '<path class="mouth-calm" d="M73 105 Q80 110 87 105" fill="none" stroke="' + B + '" stroke-width="4" stroke-linecap="round"/>' +
          '<path class="mouth-happy" d="M69 102 Q80 119 91 102 Z" fill="#B5503F" stroke="' + B + '" stroke-width="4" stroke-linejoin="round"/>' +
          '<g class="glasses" fill="rgba(255,255,255,.28)" stroke="' + B + '" stroke-width="4.5" stroke-linecap="round">' +
            '<circle cx="64" cy="85" r="15"/><circle cx="96" cy="85" r="15"/>' +
            '<path d="M79 84 Q80 80 81 84" fill="none"/>' +
            '<path d="M49 83 L37 78" fill="none"/><path d="M111 83 L123 78" fill="none"/></g>' +
          '<g class="spark" stroke="' + SPARK + '" stroke-width="6" stroke-linecap="round">' +
            '<path d="M128 34 L136 20"/><path d="M136 50 L150 42"/><path d="M138 66 L154 64"/>' +
            '<path d="M32 34 L24 20"/><path d="M24 50 L10 42"/><path d="M22 66 L6 64"/></g>' +
        '</g>' +
        '<g stroke="' + B + '" stroke-width="5" stroke-linejoin="round">' +
          '<rect x="12" y="252" width="138" height="24" rx="6" fill="' + pc[0] + '" transform="rotate(2 80 264)"/>' +
          '<rect x="14" y="238" width="134" height="24" rx="6" fill="' + pc[1] + '" transform="rotate(-2.5 80 250)"/>' +
          '<rect x="8" y="226" width="144" height="24" rx="6" fill="#FFFDF8"/>' +
          '<path d="M24 238 H86" stroke="#B9B2AA" stroke-width="4" stroke-linecap="round"/></g>' +
        '</svg>';
    }

    const box = document.getElementById("people");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const wide = window.matchMedia("(min-width:1100px) and (hover:hover) and (pointer:fine)");

    function makePerson(o, n, side, y, scale, dx) {
      const p = el("div", "person " + side);
      p.style.top = y + "px";
      p.style.setProperty("--s", scale);
      p.style.setProperty("--dx", dx + "px");
      p.innerHTML = svg(o, PAPERS[n % PAPERS.length]);
      box.appendChild(p);

      const s = p.querySelector("svg");
      const gl = p.querySelector(".glasses");
      let timer;

      p.addEventListener("pointerover", function (e) {
        if (p.contains(e.relatedTarget)) return;   // 中で動いただけ
        if (!p.classList.contains("wear")) {
          // カーソルのメガネが、顔までとんでいく
          if (!reduce) {
            const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(s.getScreenCTM().inverse());
            gl.style.transition = "none";
            gl.style.transform = "translate(" + (pt.x - 80) + "px," + (pt.y - 85) + "px) scale(.55)";
            gl.getBoundingClientRect();
            gl.style.transition = "transform .5s cubic-bezier(.34,1.56,.64,1)";
            gl.style.transform = "";
          }
          p.classList.add("wear", "handing");
        }
        // よろこぶ
        p.classList.remove("joy");
        void p.offsetWidth;
        p.classList.add("joy");
        clearTimeout(timer);
        timer = setTimeout(function () { p.classList.remove("joy"); }, 1500);
      });
      p.addEventListener("pointerout", function (e) {
        if (p.contains(e.relatedTarget)) return;
        p.classList.remove("handing");
      });
      return p;
    }

    // ページの長さに合わせて、左右にキャラをならべる（下にスクロールすると次の人が出てくる）
    let built = false;
    function build() {
      if (built || !wide.matches) return;
      built = true;
      box.style.height = "0px";
      const docH = document.documentElement.scrollHeight;
      const vh = window.innerHeight;
      const side = (window.innerWidth - 760) / 2;
      const w = Math.max(84, Math.min(side * 0.45, 135));
      box.style.height = docH + "px";

      const next = { right: Math.round(vh * 0.08), left: Math.round(vh * 0.42) };
      const gap = 80;
      const SCALES = [0.82, 1, 0.9, 0.95, 0.85];
      const JITTER = [0, 14, -10, 8, -14];
      const people = [];
      for (let n = 0; n < 40; n++) {
        const sideName = next.left < next.right ? "left" : "right";
        const scale = SCALES[n % SCALES.length];
        const h = w * scale * 284 / 160;
        const y = next[sideName];
        if (y + h > docH - 8) {
          next[sideName] = Infinity;
          if (next.left === Infinity && next.right === Infinity) break;
          continue;
        }
        people.push(makePerson(CAST[n % CAST.length], n, sideName, y, scale, JITTER[n % JITTER.length]));
        next[sideName] = y + h + gap;
      }

      // 画面に入ったら、ひょっこり出てくる
      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
        });
      }, { threshold: 0.6 });
      people.forEach(function (p) { io.observe(p); });
    }

    if (document.readyState === "complete") build();
    else window.addEventListener("load", build);
    wide.addEventListener("change", build);
  })();
</script>
</body>
</html>
